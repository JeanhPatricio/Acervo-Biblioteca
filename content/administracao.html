<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JK Falg - Administração</title>
  <link rel="stylesheet" href="../styles/administracao.css">
</head>
<body>
  <header>
    <div class="logoLogin">
      <img src="../imagens/logo.png" alt="Logo do site">
      <div class="iconesCabecalho">
        <div class="iconeNome" id="voltarBtn">
          <a href="bibliotecaria.html">
            <span class="icon">⬅️</span><br>
            <span class="textoMenu">Voltar</span>
          </a>
        </div>
        <div class="iconeNome" id="configBtn">
          <span class="icon" id="iconeConfig">⚙️</span><br>
          <span class="textoMenu">Config</span>
        </div>
        <div id="sairBtn" class="iconeNome">
          <span class="icon">👤</span><br>
          <span class="textoMenu">Sair</span>
        </div>
      </div>
    </div>
    <div class="areaPesquisa">
      <button id="abrirFiltroBtn">Filtro</button>
      <section id="modalFiltro" class="filterModal">
        <div class="filterModalConteudo">
          <span class="fechar" id="fecharModal">×</span>
          <h3>Selecione os Gêneros</h3>
          <div id="generoList">
            <label><input type="checkbox" name="genero" value="Fiction"> Ficção</label><br>
            <label><input type="checkbox" name="genero" value="Nonfiction"> Não-Ficção</label><br>
            <label><input type="checkbox" name="genero" value="Fantasy"> Fantasia</label><br>
            <label><input type="checkbox" name="genero" value="Science Fiction"> Ficção Científica</label><br>
            <label><input type="checkbox" name="genero" value="Mystery"> Mistério</label><br>
            <label><input type="checkbox" name="genero" value="Thriller"> Suspense</label><br>
            <label><input type="checkbox" name="genero" value="Romance"> Romance</label><br>
            <label><input type="checkbox" name="genero" value="Historical"> Histórico</label><br>
            <label><input type="checkbox" name="genero" value="Biography"> Biografia</label><br>
            <label><input type="checkbox" name="genero" value="Adventure"> Aventura</label><br>
            <label><input type="checkbox" name="genero" value="Horror"> Terror</label><br>
            <label><input type="checkbox" name="genero" value="Poetry"> Poesia</label><br>
            <label><input type="checkbox" name="genero" value="Drama"> Drama</label><br>
            <label><input type="checkbox" name="genero" value="Humor"> Humor</label><br>
            <label><input type="checkbox" name="genero" value="Young Adult"> Jovem Adulto</label><br>
          </div>
        </div>
      </section>
      <input type="text" id="search" placeholder="Buscar por nome, autor ou publicadora">
      <button id="buscaBtn">🔍</button>
    </div>
  </header>
  <main>
    <section class="bemvindo">
      <h2>ATUALIZAR ACERVO</h2>
      <div>
        <p>Gerencie o acervo da biblioteca: adicione, edite ou remova livros.</p>
        <button id="adicionarLivroBtn" class="btn btn-primary">Adicionar Livro</button>
        <table class="table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Ano</th>
              <th>Autor</th>
              <th>Publicadora</th>
              <th>Quantidade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-livros">
            <!-- Livros serão inseridos dinamicamente -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal para Adicionar/Editar Livro -->
  <section id="livroModal" class="livroModal">
    <div class="filterModalConteudo">
      <span class="fechar" id="fecharLivroModal">×</span>
      <h3 id="livroModalLabel">Adicionar Livro</h3>
      <form id="livro-form">
        <input type="hidden" id="livro-id">
        <div class="form-group">
          <label for="nome">Nome do Livro</label>
          <input type="text" id="nome" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="ano">Ano</label>
          <input type="number" id="ano" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="autor">Autor</label>
          <input type="text" id="autor" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="publicadora">Publicadora</label>
          <input type="text" id="publicadora" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="qtd">Quantidade</label>
          <input type="number" id="qtd" class="form-control" min="0" required>
        </div>
        <div class="form-group">
          <button type="button" class="btn btn-secondary" id="cancelarLivroBtn">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar</button>
        </div>
      </form>
    </div>
  </section>

  <script src="../scripts/script.js"></script>
  <script src="../scripts/livros.js"></script>
  <script src="../scripts/administracao.js"></script>
</body>
</html>
